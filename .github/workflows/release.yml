name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Pull requests that change packaging build and verify the tarball as an artifact.
  pull_request:
    paths:
      - scripts/package-release.mjs
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - .node-version
permissions:
  contents: read
jobs:
  # Not named `check`: a skipped job with that name could stand in for the required
  # `check` status on pull requests.
  ci:
    # ci.yml already runs this check on pull requests.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
  package:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/package-release.mjs check-tag "$GITHUB_REF_NAME"
      - run: node scripts/package-release.mjs build HEAD --out "$RUNNER_TEMP/release"
      - run: node scripts/package-release.mjs verify "$RUNNER_TEMP"/release/*.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ensemble-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/manifest.json
          retention-days: 7
          # A re-run of a failed release job uploads the same name again.
          overwrite: true
          if-no-files-found: error
  release:
    needs: [ci, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ensemble-release-${{ github.sha }}
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS release/manifest.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
