name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for changes since the previous nightly
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-nightly-changes.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ensemble-build
          overwrite: true
          path: dist
          retention-days: 1
          if-no-files-found: error
  suites:
    name: node24-${{ matrix.lane }}-${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: integrations, suite: "coordination,sources,delivery,operations,infrastructure", shard: 1, shards: 1, preflight: true }
          - { lane: execution, suite: execution, shard: 1, shards: 2 }
          - { lane: execution, suite: execution, shard: 2, shards: 2 }
          - { lane: workspaces, suite: workspaces, shard: 1, shards: 1 }
          - { lane: operator, suite: operator, shard: 1, shards: 2 }
          - { lane: operator, suite: operator, shard: 2, shards: 2 }
    env:
      TEST_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'all' || 'chromium' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: ensemble-build
          path: dist
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/ensemble-fixture-tmp
          ENSEMBLE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ensemble-test-evidence
        run: |
          mkdir -p "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR" && test -w "$ENSEMBLE_TEST_EVIDENCE_DIR"
          printf 'TMPDIR=%s\nENSEMBLE_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
      - name: Install selected browsers
        run: |
          if [ "$TEST_PROFILE" = all ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Fixture preflight
        if: matrix.preflight == true
        run: npm run test:built -- --fixture-preflight --profile="$TEST_PROFILE"
      - name: Run logical suite
        run: npm run test:built -- --suite=${{ matrix.suite }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --profile="$TEST_PROFILE"
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidence-node24-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensemble-test-evidence
          retention-days: 3
          if-no-files-found: error
  service-node26:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    name: node26-service-${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: ensemble-build
          path: dist
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/ensemble-fixture-tmp
          ENSEMBLE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ensemble-test-evidence
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ensemble-no-browsers
        run: |
          mkdir -p "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR" && test -w "$ENSEMBLE_TEST_EVIDENCE_DIR"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\nENSEMBLE_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
      - run: npm run test:built -- --profile=service --shard=${{ matrix.shard }}/2
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidence-node26-service-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensemble-test-evidence
          retention-days: 3
          if-no-files-found: error
  compatibility-node26:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: node26-full-compatibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/ensemble-fixture-tmp
          ENSEMBLE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ensemble-test-evidence
        run: |
          mkdir -p "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR" && test -w "$ENSEMBLE_TEST_EVIDENCE_DIR"
          printf 'TMPDIR=%s\nENSEMBLE_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium webkit
      # Also qualify the build tools under Node 26 on the complete compatibility run.
      - run: npm run build
      - run: npm run test:built -- --fixture-preflight
      - run: npm run test:built
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidence-node26-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensemble-test-evidence
          retention-days: 3
          if-no-files-found: error
  check:
    name: check
    if: always()
    needs: [changes, quality, suites, service-node26, compatibility-node26]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
      FULL_COMPATIBILITY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
      RUN_CHECKS: ${{ needs.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Require every applicable job to succeed
        run: node scripts/check-ci-results.mjs
