name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its base parent.
          fetch-depth: 2
      - name: Check for changes that need the checks
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-changes.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check:static
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cab-build
          overwrite: true
          path: dist
          retention-days: 1
          if-no-files-found: error
  suites:
    name: ${{ matrix.lane }}-${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: integrations, suite: "coordination,sources,delivery,operations,infrastructure", shard: 1, shards: 1, preflight: true }
          - { lane: execution, suite: execution, shard: 1, shards: 2 }
          - { lane: execution, suite: execution, shard: 2, shards: 2 }
          - { lane: workspaces, suite: workspaces, shard: 1, shards: 1 }
          - { lane: operator, suite: operator, shard: 1, shards: 2 }
          - { lane: operator, suite: operator, shard: 2, shards: 2 }
          # No browser executables: non-browser cases must run without them.
          - { lane: service, suite: all, shard: 1, shards: 2, profile: service }
          - { lane: service, suite: all, shard: 2, shards: 2, profile: service }
    env:
      TEST_PROFILE: ${{ matrix.profile || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'all' || 'chromium') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cab-build
          path: dist
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/cab-fixture-tmp
          CAB_TEST_EVIDENCE_DIR: ${{ runner.temp }}/cab-test-evidence
        run: |
          mkdir -p "$TMPDIR" "$CAB_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR" && test -w "$CAB_TEST_EVIDENCE_DIR"
          printf 'TMPDIR=%s\nCAB_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$CAB_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
          if [ "$TEST_PROFILE" = service ]; then
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/cab-no-browsers" >> "$GITHUB_ENV"
          fi
      - name: Install selected browsers
        if: matrix.profile != 'service'
        run: |
          if [ "$TEST_PROFILE" = all ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Fixture preflight
        if: matrix.preflight == true
        run: npm run test:built -- --fixture-preflight --profile="$TEST_PROFILE"
      - name: Run logical suite
        run: npm run test:built -- --suite=${{ matrix.suite }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --profile="$TEST_PROFILE"
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidence-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cab-test-evidence
          retention-days: 3
          if-no-files-found: error
  # Temporary bounded Linux reproduction for #1406; remove after diagnosis.
  preview-diagnostics:
    if: github.event_name == 'pull_request' && github.head_ref == 'cb/deliver-spec-1406'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cab-build
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Reproduce preview readiness under service load
        env:
          CAB_TEST_PROFILE: chromium
          CAB_TEST_EVIDENCE_DIR: ${{ runner.temp }}/preview-diagnostics/evidence
          DIAGNOSTICS_DIR: ${{ runner.temp }}/preview-diagnostics
          TMPDIR: ${{ runner.temp }}/preview-fixtures
        run: |
          mkdir -p "$CAB_TEST_EVIDENCE_DIR" "$DIAGNOSTICS_DIR" "$TMPDIR"
          npm run test:built -- --profile=service --shard=1/2 > "$DIAGNOSTICS_DIR/load-1.log" 2>&1 &
          load1=$!
          npm run test:built -- --profile=service --shard=2/2 > "$DIAGNOSTICS_DIR/load-2.log" 2>&1 &
          load2=$!
          result=0
          for iteration in $(seq 1 30); do
            overlap=true
            kill -0 "$load1" 2>/dev/null && kill -0 "$load2" 2>/dev/null || overlap=false
            echo "iteration=$iteration service_load_overlap=$overlap" | tee -a "$DIAGNOSTICS_DIR/results.log"
            if node --test --test-name-pattern='a comment save whose response is lost|a stage replay stays held' dist/test/workspaces/operator-local-review-browser.test.js > "$DIAGNOSTICS_DIR/target-$iteration.log" 2>&1; then
              echo "iteration=$iteration exit=0" | tee -a "$DIAGNOSTICS_DIR/results.log"
            else
              result=$?
              echo "iteration=$iteration exit=$result" | tee -a "$DIAGNOSTICS_DIR/results.log"
              cat "$DIAGNOSTICS_DIR/target-$iteration.log"
              break
            fi
          done
          load1_result=0
          load2_result=0
          wait "$load1" || load1_result=$?
          wait "$load2" || load2_result=$?
          echo "load1_exit=$load1_result load2_exit=$load2_result target_exit=$result" | tee -a "$DIAGNOSTICS_DIR/results.log"
          test "$result" -eq 0 && test "$load1_result" -eq 0 && test "$load2_result" -eq 0
      - name: Upload preview investigation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preview-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-diagnostics
          retention-days: 7
          if-no-files-found: error
  check:
    name: check
    if: always()
    needs: [changes, quality, suites]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
      RUN_CHECKS: ${{ needs.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Require every applicable job to succeed
        run: node scripts/check-ci-results.mjs
