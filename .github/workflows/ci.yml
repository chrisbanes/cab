name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      webkit:
        description: Also run WebKit browser tests
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its base parent.
          fetch-depth: 2
      - name: Check for changes that need the checks
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-changes.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check:static
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cab-build
          overwrite: true
          path: dist
          retention-days: 1
          if-no-files-found: error
  suites:
    name: ${{ matrix.lane }}-${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Browser lanes run only files with browser cases; the service lanes run every
          # non-browser case once, without browser executables.
          - { lane: integrations, suite: "coordination,sources,delivery,operations,infrastructure,execution,workspaces", shard: 1, shards: 1, preflight: true }
          - { lane: operator, suite: operator, shard: 1, shards: 4 }
          - { lane: operator, suite: operator, shard: 2, shards: 4 }
          - { lane: operator, suite: operator, shard: 3, shards: 4 }
          - { lane: operator, suite: operator, shard: 4, shards: 4 }
          - { lane: service, suite: all, shard: 1, shards: 4, profile: service }
          - { lane: service, suite: all, shard: 2, shards: 4, profile: service }
          - { lane: service, suite: all, shard: 3, shards: 4, profile: service }
          - { lane: service, suite: all, shard: 4, shards: 4, profile: service }
    env:
      TEST_PROFILE: ${{ matrix.profile || ((github.event_name == 'schedule' || inputs.webkit == true || startsWith(github.ref, 'refs/tags/')) && 'all' || 'chromium') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cab-build
          path: dist
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/cab-fixture-tmp
          CAB_TEST_EVIDENCE_DIR: ${{ runner.temp }}/cab-test-evidence
        run: |
          mkdir -p "$TMPDIR" "$CAB_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR" && test -w "$CAB_TEST_EVIDENCE_DIR"
          printf 'TMPDIR=%s\nCAB_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$CAB_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
          if [ "$TEST_PROFILE" = service ]; then
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/cab-no-browsers" >> "$GITHUB_ENV"
          fi
      - name: Install selected browsers
        if: matrix.profile != 'service'
        timeout-minutes: 6
        run: |
          # Chromium's libraries are preinstalled; WebKit needs apt.
          if [ "$TEST_PROFILE" = all ]; then
            # shortcut: bypass Azure's slow archives until actions/runner-images#14823 is fixed.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install chromium
          fi
      - name: Fixture preflight
        if: matrix.preflight == true
        run: npm run test:built -- --fixture-preflight --profile="$TEST_PROFILE"
      - name: Run logical suite
        run: npm run test:built -- --suite=${{ matrix.suite }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --profile="$TEST_PROFILE" ${{ matrix.profile != 'service' && '--browser-files-only' || '' }}
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidence-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cab-test-evidence
          retention-days: 3
          if-no-files-found: error
  reftable:
    # Delivery and workspaces in the checkout shape cab gives a task: a detached worktree of
    # a bare reftable repository that borrows the source's objects (src/standalone/workspaces.ts).
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: git --version && node --version && npm --version
      - name: Create a cab-managed reftable workspace
        run: |
          managed="$RUNNER_TEMP/cab-managed"
          workspace="$RUNNER_TEMP/cab-task/repo-1"
          git init --quiet --bare --template= --ref-format=reftable "$managed"
          printf '%s\n' "$PWD/.git/objects" > "$managed/objects/info/alternates"
          git -C "$managed" config gc.auto 0
          git -C "$managed" config maintenance.auto false
          git -C "$managed" config core.logAllRefUpdates true
          git -C "$managed" worktree add --quiet --detach "$workspace" "$(git rev-parse HEAD)"
          test "$(git -C "$workspace" rev-parse --show-ref-format)" = reftable
          mkdir -p "$RUNNER_TEMP/cab-fixture-tmp" "$RUNNER_TEMP/cab-test-evidence"
          printf 'TMPDIR=%s\nCAB_TEST_EVIDENCE_DIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/cab-fixture-tmp" "$RUNNER_TEMP/cab-test-evidence" "$RUNNER_TEMP/cab-no-browsers" >> "$GITHUB_ENV"
      - working-directory: ${{ runner.temp }}/cab-task/repo-1
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cab-build
          path: ${{ runner.temp }}/cab-task/repo-1/dist
      - name: Run delivery and workspaces in the reftable workspace
        working-directory: ${{ runner.temp }}/cab-task/repo-1
        run: npm run test:built -- --suite=delivery,workspaces --profile=service
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidence-reftable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cab-test-evidence
          retention-days: 3
          if-no-files-found: error
  check:
    name: check
    if: always()
    needs: [changes, quality, suites, reftable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
      RUN_CHECKS: ${{ needs.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Require every applicable job to succeed
        run: node scripts/check-ci-results.mjs
